<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BRIHCON Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="assets/css/admin.css">

</head>

<body>

    <script>
if(sessionStorage.getItem("adminLoggedIn") !== "true"){
    window.location.href = "login.html";
}
</script>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <h3>BRIHCON</h3>
            <small>Certificate System</small>

        </div>

        <ul>

            <li class="active">
                <i class="fas fa-home"></i>
                Dashboard
            </li>

           <li>
    <a href="students.html" class="sidebar-link">
        <i class="fas fa-user-graduate"></i>
        <span>Students</span>
    </a>
</li>

<li>
    <a href="../verify.html" class="sidebar-link">
        <i class="fas fa-award"></i>
        <span>Certificates</span>
    </a>
</li>

            <li>
                <i class="fas fa-chart-line"></i>
                Reports
            </li>

            <li>
                <i class="fas fa-cog"></i>
                Settings
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main">

        <div class="topbar">

            <h2>Dashboard</h2>

            <button class="btn btn-primary">

                <i class="fas fa-user-plus"></i>

                Add Student

            </button>

        </div>

        <!-- Cards -->

        <div class="row g-4 mb-4">

            <div class="col-lg-2">

                <div class="stat-card blue">

                    <small>Total Students</small>

                    <h2 id="totalStudents">0</h2>

                </div>

            </div>

            <div class="col-lg-2">

                <div class="stat-card green">

                    <small>Eligible</small>

                    <h2 id="eligibleStudents">0</h2>

                </div>

            </div>

            <div class="col-lg-2">

                <div class="stat-card purple">

                    <small>Issued</small>

                    <h2 id="certificatesIssued">0</h2>

                </div>

            </div>

            <div class="col-lg-2">

                <div class="stat-card orange">

                    <small>Pending</small>

                    <h2 id="pendingCertificates">0</h2>

                </div>

            </div>

            <div class="col-lg-2">

                <div class="stat-card red">

                    <small>Revoked</small>

                    <h2 id="revokedCertificates">0</h2>

                </div>

            </div>

            <div class="col-lg-2">

                <div class="stat-card dark">

                    <small>Courses</small>

                    <h2 id="courses">1</h2>

                </div>

            </div>

        </div>

        <button class="btn btn-danger" onclick="logout()">
    <i class="fas fa-sign-out-alt"></i>
    Logout
</button>

        <!-- Search -->

        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-5">

                        <input
                        id="keyword"
                        class="form-control"
                        placeholder="Search Student">

                    </div>

                    <div class="col-md-2">

                        <select class="form-select">

                            <option>All Status</option>

                        </select>

                    </div>

                    <div class="col-md-2">

                        <select class="form-select">

                            <option>All Courses</option>

                        </select>

                    </div>

                    <div class="col-md-3">

                        <button
                        class="btn btn-primary w-100"
                        onclick="loadStudents(keyword.value)">

                            Search

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Student Table -->

        <div class="card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>

                            <tr>

                                <th>Name</th>
                                <th>Email</th>
                                <th>Attendance</th>
                                <th>Status</th>
                                <th>Certificate</th>
                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="studentsTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/dashboard.js"></script>
<script src="assets/js/students.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
function logout() {
    sessionStorage.clear();

    google.accounts.id.disableAutoSelect();

    window.location.href = "login.html";
}
</script>
</body>

</html>
