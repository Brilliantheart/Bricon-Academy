<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BRIHCON Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#f5f7fb;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.card{

background:#fff;

width:420px;

padding:45px;

border-radius:18px;

box-shadow:0 15px 35px rgba(0,0,0,.12);

text-align:center;

}

img{

width:80px;

margin-bottom:20px;

}

h2{

margin-bottom:10px;

color:#0B3B75;

}

p{

margin-bottom:25px;

color:#666;

}

#error{

display:none;

margin-top:20px;

padding:12px;

background:#ffe6e6;

color:#b10000;

border-radius:8px;

font-weight:600;

}

</style>

</head>

<body>
    

<div class="card">

<img src="../assets/images/logo.png">

<h2>BRIHCON Admin Portal</h2>

<p>Sign in using your company Google account</p>

<div id="g_id_onload"
data-client_id="135973742411-jpkukju7hc62qtv8lcl8e0aqjfdagg9e.apps.googleusercontent.com"
data-callback="handleCredentialResponse">

</div>

<div class="g_id_signin"
data-type="standard"
data-size="large"
data-theme="filled_blue"
data-text="continue_with"
data-shape="pill"
data-logo_alignment="left">

</div>

<div id="error"></div>

</div>

<script>

const allowedEmails=[

"brilliantheartconsult@gmail.com",

"admin@brihcon.com",

"consulting@brihcon.com"

];

function parseJwt(token){

const base64Url=token.split('.')[1];

const base64=base64Url.replace(/-/g,'+').replace(/_/g,'/');

return JSON.parse(atob(base64));

}

function handleCredentialResponse(response){

const data=parseJwt(response.credential);

const email=data.email.toLowerCase();

if(allowedEmails.includes(email)){

sessionStorage.setItem("adminLoggedIn","true");

sessionStorage.setItem("adminEmail",email);

window.location.href="index.html";

}

else{

document.getElementById("error").style.display="block";

document.getElementById("error").innerHTML=

"Access denied.<br>"+email+" is not authorised.";

}

}

</script>

</body>
</html>
